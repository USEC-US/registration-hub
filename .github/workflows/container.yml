name: Build container

on:
  pull_request:
  push:
    branches:
      - main
      - staging
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64

          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests only need to prove that each architecture builds.
      # Nothing is pushed to GHCR.
      - name: Build
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}

          labels: ${{ steps.meta.outputs.labels }}

          build-args: |
            PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA

          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}

      # Branch/tag builds are pushed without temporary tags.
      # GHCR stores each platform image by digest.
      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}

          outputs: >-
            type=image,
            name=${{ env.IMAGE_NAME }},
            push-by-digest=true,
            name-canonical=true,
            push=true

          labels: ${{ steps.meta.outputs.labels }}

          build-args: |
            PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA

          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}

      # Pass the resulting digest to the manifest job.
      # The digest itself becomes the filename.
      - name: Export digest
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"

          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1


  manifest:
    name: Create multi-architecture image

    if: github.event_name != 'pull_request'

    needs:
      - build

    runs-on: ubuntu-24.04

    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Mutable staging image from the staging branch only.
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}

            # Immutable rollback/debug reference.
            type=sha,prefix=sha-

            # Releases.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture manifest
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()

          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_args+=("--tag" "$tag")
            fi
          done <<< "$TAGS"

          sources=()

          for digest_file in "${RUNNER_TEMP}"/digests/*; do
            digest="$(basename "$digest_file")"
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${sources[@]}"

      - name: Inspect image
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          first_tag="$(printf '%s\n' "$TAGS" | head -n 1)"
          docker buildx imagetools inspect "$first_tag"
