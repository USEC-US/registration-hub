<section class="cw-panel" aria-labelledby="cw-rules-title">
  <h3 id="cw-rules-title">Standings rules</h3>
  <dl class="cw-facts">
    <div><dt>Meetings per pair</dt><dd>{{ stage.round_robin_meetings }}</dd></div>
    <div><dt>Match points (win / draw / loss)</dt><dd>{{ stage.win_points }} / {{ stage.draw_points }} / {{ stage.loss_points }}</dd></div>
    <div><dt>Tiebreakers in order</dt><dd>{{ rule_labels|join:" → "|default:"No rules" }}</dd></div>
  </dl>
</section>
